# A new bug report gets the label of its area, so reports can be filtered by who should look at them.
# There is no list of areas here: the answer to "Where is the problem?" in the form is turned into the
# label "area: <answer in lower case>", and used only if a label of that name exists (labels are
# managed in the infra-github repository, org/labels.yaml). A new area is a new option in the form and a
# new label there.
name: Label the area

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/### Where is the problem\?\s+([^\n]+)/);
            if (!match) return;
            const label = `area: ${match[1].trim().toLowerCase()}`;
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              return; // no such label: an area nobody set one up for
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels: [label] });
