name: Bug report
description: Something on the website, the game servers or a map does not work as it should.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. A few lines are enough: what you did, what happened, and where.

        **Not here:** a security problem (see the security policy), and anything about a ban or your account, which we handle privately through a ticket on the website.
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      description: Pick the closest one. It decides who looks at the report.
      options:
        - Website
        - Game servers
        - Maps
        - Account or login
        - Discord bot
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      description: The steps that lead to the problem, if you know them. A screenshot or a short clip helps a lot.
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
  - type: input
    id: where
    attributes:
      label: Where exactly?
      description: The address of the page, the name of the server, or the map. Filled in for you when you come from the website.
  - type: input
    id: player
    attributes:
      label: Your player name
      description: Only if it helps us look at your case. This page is public.
  - type: input
    id: version
    attributes:
      label: Website version
      description: Filled in for you when you come from the website. Leave it empty otherwise.
